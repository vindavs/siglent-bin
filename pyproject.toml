[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "siglent-bin"
version = "0.2.0"
description = "Read, capture, archive, and export Siglent SDS800X HD waveforms"
readme = "README.md"
license = "MIT"
authors = [{ name = "Miķelis Vindavs" }]
requires-python = ">=3.11"
dependencies = ["numpy"]
keywords = [
    "siglent", "oscilloscope", "waveform", "binary", "scpi", "sequence",
    "sds800x", "sds802x", "sds804x", "sds812x", "sds814x", "sds822x", "sds824x",
    "sigrok", "srzip",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
siglent-bin = "siglent_bin:_main"
siglent-lan = "siglent_lan:_main"
siglent-sr = "siglent_sr:_main"

[project.urls]
Source = "https://github.com/vindavs/siglent-bin"
Issues = "https://github.com/vindavs/siglent-bin/issues"

[tool.setuptools]
py-modules = ["siglent_bin", "siglent_lan", "siglent_sr"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "BLE"]
# Ruff's formatter owns line length.
ignore = ["E501"]
